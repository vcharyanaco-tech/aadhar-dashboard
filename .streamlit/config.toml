[server]
baseUrlPath = "aadhar-dashboard"
headless = true
address = "0.0.0.0"
# This is a single-file app in a container, so the module watcher only ever
# stats files that never change. It is not free: it competes for the same
# throttled free-plan CPU as the script run.
fileWatcherType = "none"
enableXsrfProtection = true

# CORS: enabled and restricted to the two hostnames this app is served on.
# boot.py passes the same values as flags, and a flag wins, so they are stated in
# both places deliberately. The previous `false` made Streamlit reply with
# `Access-Control-Allow-Origin: *` and accept a WebSocket from any origin, and
# it warned about that on every boot.
enableCORS = true
corsAllowedOrigins = [
  "https://dashboardharyana.site",
  "https://www.dashboardharyana.site",
]
allowedHosts = [
  "dashboardharyana.site",
  "www.dashboardharyana.site",
  "aadhar-dashboard-5i4x.onrender.com",
]

# Upload cap in MB. Kept in step with --server.maxUploadSize in boot.py: Streamlit
# gives the command-line flag precedence, so the two must agree or the effective
# limit depends on how the app was started.
maxUploadSize = 15

[browser]
gatherUsageStats = false
