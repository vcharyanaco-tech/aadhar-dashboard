services:
  - type: web
    name: aadhar-dashboard
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    # boot.py restores aadhaar.db from the Cloudflare Worker bridge before
    # Streamlit opens the database, then execs Streamlit. See kv_sync.py.
    startCommand: python boot.py
    healthCheckPath: /aadhar-dashboard/_stcore/health
    autoDeployTrigger: commit
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.3"
      # Keep the process inside the 512 MB free-instance limit. Multiple glibc
      # malloc arenas and BLAS/OpenMP thread pools hold memory that pandas and
      # Streamlit never use on a 0.1-CPU instance; cap them instead of letting
      # each library size itself for the host.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "65536"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      # No admin credentials here: the first-run setup screen creates the admin
      # in the database. ADMIN_USERNAME / ADMIN_PASSWORD are not read by the code.
      #
      # The bridge is the dedicated aadhar-backup Worker, in its own Cloudflare
      # account, so its write budget and stored snapshots are not shared with
      # dash-site. The old URL (dash-site's /api/backup) never worked: that
      # Worker does not route /aadhaar-db, so every restore and push 404'd.
      - key: AADHAR_SYNC_URL
        value: https://aadhar-backup.aadhar-haryana.workers.dev
      # Must match the BRIDGE_TOKEN secret on the aadhar-backup Worker.
      - key: AADHAR_SYNC_TOKEN
        sync: false
      # Shared initial password for bulk-created division logins. Lives here
      # rather than in app.py so the credential is not committed to the
      # repository; users are still forced to set a new password on first login.
      # If this is unset, a random password is generated per batch instead.
      - key: AADHAR_DEFAULT_TEMP_PASSWORD
        sync: false
      # Defaults are 1 hour / 15 minutes; stated here so the intent is visible.
      - key: AADHAR_SYNC_INTERVAL_MS
        value: "3600000"
      - key: AADHAR_SYNC_MIN_INTERVAL_MS
        value: "900000"
