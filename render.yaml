services:
  - type: web
    name: aadhar-dashboard
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /aadhar-dashboard/_stcore/health
    autoDeployTrigger: commit
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
