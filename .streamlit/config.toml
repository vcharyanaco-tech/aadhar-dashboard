[server]
baseUrlPath = "aadhar-dashboard"
headless = true
address = "0.0.0.0"
# This is a single-file app in a container, so the module watcher only ever
# stats files that never change. It is not free: it competes for the same
# throttled free-plan CPU as the script run.
fileWatcherType = "none"
enableXsrfProtection = true

# CORS left off, as it was before. Turning it on with an explicit
# corsAllowedOrigins allowlist was tried and took the app down: Streamlit's
# host-config then advertised only its own default origins, a browser at
# dashboardharyana.site had its WebSocket rejected, and the page rendered as a
# blank shell with the service still answering /health 200.
#
# With CORS off, Streamlit sends no Access-Control-Allow-Origin header, so a
# cross-origin browser request is blocked by the browser itself. The startup
# warning Streamlit prints about this is a generic notice about a posture that
# is a deliberate choice for a directly-exposed app, not a misconfiguration.
enableCORS = false

# Upload cap in MB. Kept in step with --server.maxUploadSize in boot.py: Streamlit
# gives the command-line flag precedence, so the two must agree or the effective
# limit depends on how the app was started.
maxUploadSize = 15

[browser]
gatherUsageStats = false
